<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" fill="none" role="img" aria-labelledby="scene-title scene-description">
  <title id="scene-title">海边小岛的暖晴午后</title>
  <desc id="scene-description">奶油色天空下，橘色小屋和灯塔望着雾蓝海湾。有人坐在树下阅读，有人带着小狗散步。云、树叶和海面缓慢活动。</desc>
  <style>
    .cloud-near { animation: cloud-travel 22s ease-in-out infinite alternate; }
    .cloud-far { animation: cloud-travel 29s ease-in-out -10s infinite alternate-reverse; }
    .sea-lines { animation: water-travel 11s ease-in-out infinite alternate; }
    .tree-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: leaves-sway 8s ease-in-out infinite alternate; }
    .small-tree-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: leaves-sway 7s ease-in-out -3s infinite alternate-reverse; }
    .walker-arm { transform-box: fill-box; transform-origin: 50% 8%; animation: arm-swing 2.5s ease-in-out infinite alternate; }
    .walker-front-leg { transform-box: fill-box; transform-origin: 45% 3%; animation: step-swing 2.5s ease-in-out infinite alternate; }
    .walker-back-leg { transform-box: fill-box; transform-origin: 50% 3%; animation: step-swing 2.5s ease-in-out -2.5s infinite alternate; }
    .dog-tail { transform-box: fill-box; transform-origin: 5% 100%; animation: tail-swing 1.8s ease-in-out infinite alternate; }
    @keyframes cloud-travel { from { transform: translateX(-7px); } to { transform: translateX(12px); } }
    @keyframes water-travel { from { transform: translateX(-3px); opacity: .5; } to { transform: translateX(6px); opacity: .85; } }
    @keyframes leaves-sway { from { transform: rotate(-.8deg); } to { transform: rotate(1deg); } }
    @keyframes arm-swing { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
    @keyframes step-swing { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes tail-swing { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
    @media (prefers-reduced-motion: reduce) {
      .cloud-near, .cloud-far, .sea-lines, .tree-crown, .small-tree-crown, .walker-arm, .walker-front-leg, .walker-back-leg, .dog-tail { animation: none; }
    }
  </style>
